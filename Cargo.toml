[package]
name = "buddy-rs"
version = "0.3.0"
edition = "2024"
authors = ["Fiaro fiaromiangaly@gmail.com"]
keywords = ["buddy", "terminal", "shell", "tool", "productivity"]
categories = ["command-line-utilities"]
description = "Rust-based shell assistant that helps you through your Linux/macOS terminal journey."
repository = "https://github.com/Emii-lia/buddy-rs"
homepage = "https://crates.io/crates/buddy-rs"
license = "MIT"


[dependencies]
anyhow = "1.0.102"
tokio = { version = "1.52.3", features = ["full"]}
clap = { version = "4.6.1", features = ["derive"] }
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
colored = "3.1.1"
async-trait = "0.1.89"
reqwest = { version = "0.13.4", features = ["json"] }
dotenvy = "0.15.7"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
